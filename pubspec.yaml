name: secure_chat
description: End-to-end encrypted chat application using Flutter and Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0

  # E2E Encryption
  pointycastle: ^3.7.4
  encrypt: ^5.0.3

  # UI & State
  provider: ^6.1.1
  go_router: ^13.0.1
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utilities
  equatable: ^2.0.5
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/